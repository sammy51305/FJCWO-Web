{% extends "base.html" %}

{% block title %}入團申請 — 百韻管樂團{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-sm-10 col-md-7 col-lg-6">

    <div class="text-center mb-4">
      <i class="bi bi-person-plus fs-1 text-primary"></i>
      <h2 class="mt-2 mb-1">入團申請</h2>
      <p class="text-muted">填寫資料後，幹部審核通過即可取得帳號。</p>
    </div>

    <div class="card">
      <div class="card-body">
        <form method="post">
          {% csrf_token %}

          {% include "accounts/_profile_fields.html" %}

          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-send me-1"></i> 送出申請
            </button>
            <a href="{% url 'accounts:registration_status' %}" class="btn btn-outline-secondary">
              查詢申請狀態
            </a>
          </div>
        </form>
      </div>
    </div>

  </div>
</div>
{% endblock %}
