name: Secret File Guard

# server 端防線：PR 合進 main 前，掃描「合併後的檔案樹」是否含機敏檔／本機產物。
# 命中就讓這個 check 失敗 → 搭配 main 的 branch protection「Require status checks to pass」
# 擋住 merge。與 .githooks/pre-commit 用同一組 pattern（本機快速回饋 + 遠端強制把關）。
# 兩邊的清單要刻意保持一致，改規則時記得同步更新。

on:
  pull_request:
    branches: [main]

jobs:
  guard:
    name: 機敏檔檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 掃描不該進版控的檔案
        shell: bash
        run: |
          blocked=""
          while IFS= read -r f; do
            base=$(basename "$f")

            # 範本檔允許進版控（本身不含真憑證）
            case "$base" in
              .env.example|.env.sample) continue ;;
            esac

            case "$f" in
              .env|*/.env|.env.*|*/.env.*)  blocked+=$'\n  '"$f  （環境變數／密鑰）" ;;
              *.csv|*.xlsx)                 blocked+=$'\n  '"$f  （資料匯出檔，可能含個資）" ;;
              db.sqlite3|*/db.sqlite3)      blocked+=$'\n  '"$f  （本機資料庫）" ;;
              *.pem|*.key|*.pfx)            blocked+=$'\n  '"$f  （憑證／金鑰）" ;;
              .private/*|private/*)         blocked+=$'\n  '"$f  （機敏資料夾）" ;;
            esac
          done < <(git ls-files)

          if [ -n "$blocked" ]; then
            echo "::error::偵測到不該進版控的機敏檔／本機產物，PR 檢查失敗"
            echo "❌ 下列檔案不可進 git："
            echo -e "$blocked"
            echo ""
            echo "修正方式（檔案已在 git 歷史裡，刪工作目錄不夠）："
            echo "  git rm --cached <檔案>     # 從版控移除、保留本機檔"
            echo "  git commit -m 'chore: 移除誤入版控的機敏檔'"
            echo "  並確認該檔已被 .gitignore 涵蓋"
            exit 1
          fi
          echo "✅ 未發現機敏檔"
